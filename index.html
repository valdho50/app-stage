<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appel Stage de Printemps</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
               background: #f4f7f6; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .container { width: 90%; max-width: 400px; padding: 20px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 1.5rem; margin-bottom: 25px; }
        .btn { display: block; width: 100%; padding: 15px 0; margin: 10px 0; border: none; border-radius: 12px; 
               font-size: 1rem; font-weight: bold; cursor: pointer; text-decoration: none; transition: transform 0.2s; }
        .btn-primary { background: #2ecc71; color: white; } /* Vert pour lancer */
        .btn-secondary { background: #3498db; color: white; } /* Bleu pour installer */
        .btn:active { transform: scale(0.98); }
        .instructions { display: none; margin-top: 20px; font-size: 0.9rem; color: #7f8c8d; border-top: 1px solid #eee; padding-top: 15px; }
        #ios-guide { color: #2c3e50; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Appel Stage de Printemps</h1>
    
    <!-- Bouton 1 : Lancer directement Grist -->
    <a href="https://grist.numerique.gouv.fr/o/docs/a4S2BHPm2g1P/Stage-de-Printemps/p/8?hide-side-bars=1" class="btn btn-primary">
        🚀 Lancer l'application
    </a>

    <!-- Bouton 2 : Afficher les instructions d'installation -->
    <button onclick="showInstall()" class="btn btn-secondary">
        📲 Installer sur mon écran d'accueil
    </button>

    <!-- Zone d'instructions dynamique -->
    <div id="install-guide" class="instructions">
        <p id="android-text">Sur Android : Cliquez sur les 3 points [⋮] puis "Installer l'application".</p>
        <p id="ios-text">Sur iPhone : Cliquez sur l'icône de partage [<img src="https://img.icons8.com/ios/20/000000/export.png">] puis sur "Sur l'écran d'accueil".</p>
    </div>
</div>

<script>
    function showInstall() {
        document.getElementById('install-guide').style.display = 'block';
    }

    // Enregistrement du Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    // Détection automatique du système pour n'afficher que le bon message
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS) {
        document.getElementById('android-text').style.display = 'none';
    } else {
        document.getElementById('ios-text').style.display = 'none';
    }
</script>

</body>
</html>
