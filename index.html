<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Appel Stage</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Le conteneur qui sert de "fenêtre" */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; /* Empêche de scroller en dehors de l'iframe */
            background-color: white;
        }

        .app-container {
            position: absolute;
            /* ON DÉCALE L'IFRAME POUR CACHER LES BORDS */
            top: -110px;      /* Cache la barre supérieure de Grist */
            bottom: -60px;    /* Cache les boutons flottants du bas */
            left: 0;
            right: 0;
            width: 100%;
            height: calc(100% + 170px); /* On compense les décalages haut/bas */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- On utilise l'URL standard SANS EMBED pour être sûr que l'écriture fonctionne -->
        <iframe src="https://grist.numerique.gouv.fr/o/docs/a4S2BHPm2g1P/Stage-de-Printemps/p/8"></iframe>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
